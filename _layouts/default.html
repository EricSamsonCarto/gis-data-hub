<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --paper: #f6f7f5;
        --ink: #1c2b30;
        --muted: #5d6a6e;
        --line: #d8dddb;
        --link: #1f5e86;
        --contour: #c9d3d1;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121a1d;
          --ink: #e3e9ea;
          --muted: #95a3a6;
          --line: #2a3639;
          --link: #7fb6d8;
          --contour: #24312f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 17px/1.6 "Public Sans", system-ui, sans-serif;
      }
      a { color: var(--link); text-underline-offset: 3px; }
      a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 0 20px; }

      header { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
      header svg { position: absolute; right: -60px; top: -40px; width: 520px; height: auto; color: var(--contour); }
      header .wrap { position: relative; padding-top: 88px; padding-bottom: 40px; }
      header h1 { margin: 0; font-size: clamp(2.25rem, 6vw, 3.25rem); line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; }
      header h1 a { color: inherit; text-decoration: none; }
      header p { margin: 14px 0 0; max-width: 58ch; color: var(--muted); }

      main { padding: 24px 0 80px; }
      main h2 { margin: 48px 0 4px; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
      main h2 + p { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }

      .files { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      .files li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
      .files .name { font-weight: 500; }
      .files code { grid-column: 1; font: 400 0.8rem/1.4 "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
      .files button {
        grid-column: 2; grid-row: 1 / span 2;
        font: 500 0.85rem "Public Sans", sans-serif; color: var(--ink);
        background: transparent; border: 1px solid var(--line); border-radius: 6px;
        padding: 6px 12px; cursor: pointer;
      }
      .files button:hover { border-color: var(--muted); }
      .empty { color: var(--muted); }

      footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <header>
      <!-- contour lines: a nod to the topo maps these files end up in -->
      <svg viewBox="0 0 520 360" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
        <path d="M262 182c38-6 70 14 66 46s-48 44-86 36-62-38-50-62 32-16 70-20z"/>
        <path d="M258 140c62-10 118 18 116 78s-78 84-142 74-108-58-94-104 58-38 120-48z"/>
        <path d="M250 98c86-14 168 20 168 118s-104 128-196 116-158-80-140-148 82-72 168-86z"/>
        <path d="M244 56c110-18 216 22 220 158s-130 172-250 158S8 270 30 182 134 74 244 56z"/>
        <path d="M238 14c134-22 264 24 272 198s-156 216-302 200S-36 286-12 176 104 36 238 14z"/>
      </svg>
      <div class="wrap">
        <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
      </div>
    </header>
    <main class="wrap">
      {{ content }}
    </main>
    <footer class="wrap">
      Maintained by <a href="https://ericsamson.com">Eric Samson</a>. Source on <a href="https://github.com/EricSamsonCarto/gis-data-hub">GitHub</a>.
    </footer>
    <script>
      document.addEventListener('click', e => {
        const b = e.target.closest('button[data-url]');
        if (!b) return;
        navigator.clipboard.writeText(b.dataset.url).then(() => {
          b.textContent = 'Copied';
          setTimeout(() => b.textContent = 'Copy URL', 1500);
        });
      });
    </script>
  </body>
</html>
